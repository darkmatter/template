services:
  web:
    # Built by Nix (ops/container/web/image.nix); `just container-image`
    # loads it into Docker under this tag.
    image: ghcr.io/darkmatter/template:local
    environment:
      APP_ENV: development
      APP_RELEASE: compose-local
    ports:
      - "${AGENT_DEMO_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
