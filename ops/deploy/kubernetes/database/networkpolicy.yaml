apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: template-postgres
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: template-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: template-postgres
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-demo
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: 5432
    - from:
        # The Tailscale operator creates one managed proxy for the CNPG
        # additional Service. It is reachable only from approved tailnet
        # devices, never from the public Internet.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/managed: "true"
              tailscale.com/parent-resource: template-postgres-tailnet
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9187
