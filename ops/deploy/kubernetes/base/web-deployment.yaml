apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-demo-web
  labels:
    app.kubernetes.io/name: ops-demo
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ops-demo
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-demo
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: ghcr.io/example/ops-demo:replace-me
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: ops-demo-runtime
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
