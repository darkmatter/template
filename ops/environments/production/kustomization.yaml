apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: template-production
resources:
  - ../../deploy/kubernetes/base
  - ../../deploy/kubernetes/database
generators:
  - postgres-secret-generator.yaml
patches:
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: template-postgres
    path: teleport-access.patch.yaml
  - path: ghcr-pull-secret.patch.yaml
  - path: replicas.patch.yaml
  - path: runtime-config.patch.yaml
  - path: resources.patch.yaml
images:
  - name: ghcr.io/example/agent-demo
    newName: ghcr.io/darkmatter/template
    digest: sha256:dbfe7f92fe57effb90085892b8a0d5cbd74e6360271624bac65bc9b69658272f
