apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ops-demo-web
spec:
  rules:
    - host: ops-demo.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ops-demo-web
                port:
                  name: http
