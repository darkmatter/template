apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-demo-web
spec:
  rules:
    - host: agent-demo.staging.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-demo-web
                port:
                  name: http
