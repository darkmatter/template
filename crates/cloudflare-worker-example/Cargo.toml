[package]
name = "cloudflare-worker-example"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
# workers-rs 0.8 depends on wasm-streams 0.6, which needs Rust 1.88.
rust-version = "1.88"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8"
worker-macros = "0.8"
