[workspace]
members = ["crates/agent-sandboxd", "crates/alloy-web3-example"]
exclude = ["apps/native/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.77.2"

[workspace.dependencies]
alloy = { version = "0.2.1", default-features = false, features = [
  "contract",
  "provider-http",
  "reqwest-rustls-tls",
  "rpc-types",
  "std",
] }
eyre = "0.6.14"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
