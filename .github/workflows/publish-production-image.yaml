name: Publish production image

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/tooling/**
      - packages/web-core/**
      - ops/container/web/Dockerfile
      - package.json
      - bun.lock
      - .github/workflows/publish-production-image.yaml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-production-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/darkmatter/template
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/container/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
      - name: Make the package pullable by the cluster
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH /orgs/darkmatter/packages/container/template -f visibility=public
      - name: Pin the production overlay to the published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("ops/environments/production/kustomization.yaml")
          content = path.read_text()
          updated = re.sub(
              r"(?m)^    digest: sha256:[0-9a-f]{64}$",
              f"    digest: {os.environ['DIGEST']}",
              content,
          )
          if updated == content:
              raise SystemExit("production image digest was not updated")
          path.write_text(updated)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/environments/production/kustomization.yaml
          git commit -m "chore: pin production image digest"
          git push
